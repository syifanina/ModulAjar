<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran: Ciri-ciri Kerucut 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .back-btn {
            background-color: #2980b9;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <h1>Kerucut 3D Interaktif</h1>
        <p class="subtitle">Eksplorasi ciri-ciri kerucut dengan memutar dan klik!</p>
        <div class="controls">
            <button id="btn-sisi" onclick="setMode('sisi')">Tampilkan Sisi (?)</button>
            <button id="btn-rusuk" onclick="setMode('rusuk')">Tampilkan Rusuk (?)</button>
            <button id="btn-sudut" onclick="setMode('sudut')">Tampilkan Titik Sudut (?)</button>
            <button id="btn-jaring" onclick="setMode('jaring')">Jaring-Jaring</button>
            <button id="btn-fold" onclick="toggleFold()" style="display: none; background-color: #e67e22; color: white;">🔓 Buka Jaring-Jaring</button>
        </div>
        <button id="btn-music" class="music-btn" onclick="toggleMusic()">🔇 Nyalakan Musik</button>
        <a href="../index.html" class="back-btn" style="margin-top:20px; color:white;">⬅ Kembali ke Menu Utama</a>
    </div>
    <div id="info-panel" class="info-panel hidden"></div>
    <audio id="bgMusic" loop><source src="https://syifanina.github.io/genially_assets/musik_3d.mp3" type="audio/mpeg"></audio>
    <div class="watermark">Made by Syifa Sabrina</div>
    <div id="labels-container"></div>
    <div id="tooltip" class="hidden"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
